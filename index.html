  @font-face{font-family:"Open Sans Unive";src:url("https://login-zakelijk.unive.nl/static/fonts/OpenSans-Regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}
  @font-face{font-family:"Open Sans Unive";src:url("https://login-zakelijk.unive.nl/static/fonts/OpenSans-Bold.woff2") format("woff2");font-style:normal;font-weight:700;font-display:swap}
  :root{

    --focus:#005fcc; --radius:14px; --shadow:0 2px 10px rgba(0,0,0,.06);
    --max:1160px; --font-body:"Open Sans Unive","Open Sans",Arial,sans-serif; --font-heading:"Bree Serif",Georgia,serif;
  }
  *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;font-synthesis:none;font-family:var(--font-body);font-size:16px;font-weight:400;color:var(--ink);background:var(--bg);line-height:1.55}
  p,li,dd,dt,span,label,legend,strong,b,button,input,select,textarea{font-family:var(--font-body)} p,li{font-size:16px;font-weight:400;line-height:1.55} strong, b{font-weight:700;font-style:normal} p{margin-top:0} .card p:not(.lead):not(.hint):not(.why){line-height:1.55} button,input,select,textarea{font-family:var(--font-body);font-size:16px;font-weight:400} button,input,select{font-family:var(--font-body);font-size:inherit;line-height:inherit;color:inherit} button strong,button b,label strong,label b{font-family:var(--font-body);font-weight:700} button{cursor:pointer} button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .topbar{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .topbar-inner{max-width:var(--max);margin:auto;display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
  .brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:22px}.brand-logo{display:block;width:204px;max-width:204px;height:auto;flex:0 0 auto}.brand-copy{border-left:1px solid var(--line);padding-left:14px;color:#24332b}.brand small{font-size:13px;color:var(--muted);font-weight:700;display:block}
  .demo-toggle{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:700}
  .progress-wrap{background:#fff;border-bottom:1px solid var(--line);font-family:var(--font-body);font-weight:400}.progress-wrap *{font-family:var(--font-body)}
  .progress{max-width:var(--max);margin:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:11px 18px}
  .progress .step{font-family:var(--font-body);font-size:12px;font-weight:400;line-height:1.4;color:#667;display:flex;align-items:center;gap:7px;min-width:0}.step-dot{width:24px;height:24px;border-radius:50%;border:2px solid #bbb;display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto}.step.active{color:var(--u-green-dark);font-weight:700}.step.active .step-dot,.step.done .step-dot{background:var(--u-green);color:#10271b;border-color:var(--u-green)}
  .app{max-width:var(--max);margin:auto;padding:28px 18px 96px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}.main{min-width:0}.side{position:sticky;top:125px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:18px}.hero{padding:28px}.eyebrow{font-size:13px;font-weight:700;color:var(--u-green-dark);text-transform:uppercase;letter-spacing:.04em}h1,h2,h3{font-family:var(--font-heading);font-weight:400;letter-spacing:0}h1{font-size:36px;line-height:1.14;margin:8px 0 12px}h2{font-size:25px;line-height:1.2;margin:0 0 12px}h3{font-size:19px;line-height:1.25;margin:0 0 8px}.lead{font-family:var(--font-body);font-size:18px;font-weight:400;line-height:1.55;color:#41484e;margin:0 0 20px}.muted{color:var(--muted)}
  .question-card{box-shadow:none}.question-legend{font-family:var(--font-body);font-size:18px;font-weight:700;line-height:1.4}.search-row{display:flex;gap:10px}.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}.field label{font-weight:700}.input,.select{width:100%;padding:13px 14px;border:1.5px solid #9fa7ad;border-radius:10px;background:#fff}.hint{font-family:var(--font-body);font-size:14px;font-weight:400;line-height:1.5;color:var(--muted)}

  .actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px}.actions-right{display:flex;gap:10px}.stack{display:grid;gap:10px}.choice{border:1.5px solid #c9ced3;border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start;background:#fff}.choice:hover{border-color:#959da3}.choice.selected{border:2px solid var(--u-green);background:var(--u-green-soft)}.choice input{margin-top:4px;accent-color:var(--u-green-dark)}.choice strong{display:block;font-weight:700}.choice .sub{font-size:13px;color:var(--muted)}
  .result{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:10px;display:flex;justify-content:space-between;gap:14px;align-items:center;font-family:var(--font-body);font-size:16px;font-weight:400;line-height:1.5;color:var(--ink);appearance:none;-webkit-appearance:none}.result *{font-family:var(--font-body)}.result strong{font-family:var(--font-body);font-weight:700}.result:hover{border-color:#999}.result .meta{font-family:var(--font-body);font-size:13px;font-weight:400;line-height:1.45;color:var(--muted)}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;align-items:flex-end;justify-content:center}.modal-backdrop.open{display:flex}.modal{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:24px}.modal h2{padding-right:40px}.modal-close{float:right;border:0;background:#f1f3f4;border-radius:50%;width:38px;height:38px;font-size:20px}

  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1c252b;color:white;padding:10px 14px;border-radius:9px;z-index:120;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.small{font-size:13px}.divider{height:1px;background:#e6e9eb;margin:16px 0}

 webshop:{id:'webshop',name:'Pakket & Co Webshop',legal:'Eenmanszaak',kvk:'45678901',address:'Havenweg 17, 3024 BC Rotterdam',sbi:'47910',activity:'Webshop',employees:0,established:'2021',eligibility:'ONLINE_FULL',facts:{worksHome:false,professionalAdvice:false,customerLocation:false,companyVehicle:false,inventory:true,stock:true,rentedPremise:true,ownPremise:false,onlineSales:true}},

};
const steps=['Je bedrijf','Over je onderneming','Jouw voorstel','Samenstellen','Je gegevens','Controleren & aanvragen'];
const productDefs={
 avb:{name:'Bedrijfsaansprakelijkheid',desc:'Dekt schade aan personen of spullen van anderen door je bedrijf.',base:18.70,coverageOptions:[1250000,2500000,5000000],deductibles:[0,250,500,1000]},
 beroeps:{name:'Beroepsaansprakelijkheid',desc:'Voor financiële schade door een beroepsfout of verkeerd advies.',base:26.40,coverageOptions:[250000,500000,1000000],deductibles:[250,500,1000]},
 inventaris:{name:'Inventaris en goederen',desc:'Voor zakelijke spullen, gereedschap en voorraad op je locatie.',base:21.50,coverageOptions:[25000,50000,100000],deductibles:[250,500,1000]},
 auto:{name:'Bedrijfsauto',desc:'Voor schade met of aan je bedrijfsauto.',base:54.20,coverages:['WA','WA + beperkt casco','Allrisk'],deductibles:[0,250,500]},
 rechtsbijstand:{name:'Zakelijke rechtsbijstand',desc:'Juridische hulp bij zakelijke conflicten.',base:14.80,coverageOptions:[1],deductibles:[0]}
};
function initialState(companyId='studio'){
 const c=companies[companyId]; return {step:1,company:null,scenario:companyId,companyLoaded:false,knownFacts:{},inferences:{},answers:{},riskSignals:{},recommendations:{},selectedProducts:[],customer:{name:'',email:'',phone:'',startDate:'2026-09-01',iban:''},errors:{kvk:false,pricing:false},applicationStatus:'draft',history:[],demo:{eligibilityOverride:'',viewport:'auto'}};
}
let state=initialState('studio');
function infer(c){const inf={};if(c.id==='painter'){inf.works_at_customer_location={value:true,confidence:'high'};inf.uses_tools={value:true,confidence:'medium'}}if(c.id==='studio'){inf.professional_advice={value:true,confidence:'high'};inf.works_at_customer_location={value:true,confidence:'medium'}}if(c.id==='salon'){inf.customer_visits_premise={value:true,confidence:'high'}}if(c.id==='webshop'){inf.has_stock={value:true,confidence:'high'};inf.business_interruption_sensitive={value:true,confidence:'medium'}}return inf}
function getFact(k){if(k in state.answers)return state.answers[k];return state.company?.facts?.[k]}
function evidence(label,source='answer'){return {label,source}}
function buildRiskAssessment(){
 const c=state.company;if(!c)return [];
 const risks=[];
 const add=(id,title,level,summary,evidenceItems,product,score)=>risks.push({id,title,level,summary,evidence:evidenceItems,product,score});
 if(getFact('customerLocation')) add('third_party_damage','Schade bij klanten of andere derden','high','Omdat je werkzaamheden op locatie uitvoert, kan tijdens het werk schade ontstaan aan spullen of eigendommen van anderen.',[
   evidence(`${c.activity} · SBI ${c.sbi}`,'kvk'),evidence('Je werkt op locatie bij klanten','answer')],'avb',92);
 else if(state.inferences.works_at_customer_location?.value) add('third_party_damage','Schade bij klanten of andere derden','medium','Op basis van je bedrijfsactiviteit verwachten we dat werkzaamheden bij klanten kunnen voorkomen. Dit risico wordt zwaarder zodra je dat bevestigt.',[
   evidence(`${c.activity} · SBI ${c.sbi}`,'kvk'),evidence(`Werkzaamheden bij klanten: inschatting ${state.inferences.works_at_customer_location.confidence}`,'inferred')],'avb',68);
 if(getFact('professionalAdvice')) add('financial_loss','Financiële schade door advies of een beroepsfout','high','Je dienstverlening kan leiden tot financiële schade bij een opdrachtgever wanneer een advies, ontwerp of professionele fout verkeerd uitpakt.',[
   evidence(`${c.activity} · SBI ${c.sbi}`,'kvk'),evidence('Je geeft professioneel advies of ontwerpt voor klanten','answer')],'beroeps',94);
 else if(state.inferences.professional_advice?.value) add('financial_loss','Financiële schade door advies of een beroepsfout','medium','Je bedrijfsactiviteit wijst op professionele dienstverlening. Daarom zien we mogelijk een beroepsrisico dat om bevestiging vraagt.',[
   evidence(`${c.activity} · SBI ${c.sbi}`,'kvk'),evidence(`Professioneel advies: inschatting ${state.inferences.professional_advice.confidence}`,'inferred')],'beroeps',70);
 if(getFact('inventory')||getFact('stock')) add('property_damage','Schade aan inventaris, gereedschap of voorraad',getFact('stock')?'high':'medium',getFact('stock')?'Je onderneming heeft zakelijke spullen én voorraad/materialen. Beschadiging, brand of diefstal kan daardoor direct financiële impact hebben.':'Je gebruikt zakelijke inventaris, gereedschap of apparatuur die belangrijk is om je werk uit te voeren.',[
   evidence(`${c.activity} · ${c.employees} medewerker${c.employees===1?'':'s'}`,'kvk'),...(getFact('inventory')?[evidence('Zakelijke inventaris/apparatuur aanwezig','answer')]:[]),...(getFact('stock')?[evidence('Voorraad of materialen aanwezig','answer')]:[])],'inventaris',getFact('stock')?90:78);
 if(getFact('companyVehicle')) add('vehicle_damage','Mobiliteits- en voertuigrisico','high','Je gebruikt een bedrijfsauto. Schade aan of met het voertuig kan direct invloed hebben op je bedrijfsvoering.',[
   evidence(`${c.activity} · SBI ${c.sbi}`,'kvk'),evidence('Je gebruikt een bedrijfsauto of bestelbus','answer')],'auto',96);
 if(c.employees>0) add('legal_conflict','Juridische conflicten rond bedrijfsvoering',c.employees>=4?'medium':'low',`Je bedrijf heeft ${c.employees} medewerkers. Met personeel, klanten en leveranciers zijn er meer zakelijke afspraken waarbij een conflict kan ontstaan.`,[
   evidence(`${c.employees} medewerkers`,'kvk'),evidence(c.legal,'kvk')],'rechtsbijstand',c.employees>=4?66:52);
 if(getFact('rentedPremise')||getFact('ownPremise')) add('premise_damage','Schade op je bedrijfslocatie','medium','Je werkt vanuit een bedrijfspand. Schade op die locatie kan gevolgen hebben voor je inventaris, voorraad en continuïteit.',[
   evidence(getFact('ownPremise')?'Eigen bedrijfspand':'Gehuurd bedrijfspand','answer'),evidence(c.address,'kvk')],'inventaris',72);
 if(getFact('onlineSales')) add('cyber_dependency','Afhankelijkheid van online verkoop','medium','Je omzet is afhankelijk van online verkoop. Digitale uitval kan de bedrijfsvoering verstoren. Voor dit prototype koppelen we hier nog geen direct online product aan.',[
   evidence(`${c.activity} · SBI ${c.sbi}`,'kvk'),evidence('Online verkoop is onderdeel van de bedrijfsactiviteit','answer')],null,58);
 return risks.sort((a,b)=>b.score-a.score)
}
function calcRisks(){let r={};for(const item of buildRiskAssessment())r[item.id]=item.level==='low'?'potential':'confirmed';state.riskSignals=r}
function recommend(){
 const assessments=buildRiskAssessment();calcRisks();let rec={};
 for(const a of assessments){if(!a.product)continue;const existing=rec[a.product];const status=a.score>=75?'recommended':a.score>=55?'relevant':'optional';if(!existing||a.score>existing.score)rec[a.product]={status,score:a.score,reason:a.summary,riskId:a.id,evidence:a.evidence};}
 if(!rec.rechtsbijstand)rec.rechtsbijstand={status:'optional',score:35,reason:'Juridische hulp kan bij zakelijke afspraken of conflicten relevant zijn.',riskId:null,evidence:[]};
 state.recommendations=rec
}
function riskSourceLabel(source){return source==='kvk'?'Bedrijfsdata':source==='inferred'?'Onze inschatting':'Jouw antwoord'}
function riskLevelLabel(level){return level==='high'?'Hoger aandachtspunt':level==='medium'?'Aandachtspunt':'Beperkt signaal'}
function overallRiskScore(items){if(!items.length)return 0;return Math.round(items.reduce((s,x)=>s+x.score,0)/items.length)}
function renderRiskAssessment(){
 const items=buildRiskAssessment();const score=overallRiskScore(items);const matched=items.filter(x=>x.product).length;
 const intro=items.length?`We zien ${items.length} relevante risicosignalen. Voor ${matched} daarvan kunnen we in dit prototype een passende productmatch maken.`:'Op basis van de beschikbare gegevens zien we nog geen sterke risicosignalen.';
 return `<section class="card" aria-labelledby="riskTitle"><div class="risk-intro"><div class="risk-summary-copy"><div class="eyebrow">Risico-inschatting</div><h2 id="riskTitle">Dit zien we in jouw bedrijf</h2><p>${intro}</p><p class="muted">We combineren je KVK- en bedrijfsgegevens met je antwoorden. Aannames tonen we apart en behandelen we niet als feit.</p></div><div class="risk-score"><span class="small muted">Matchscore</span><strong>${score}/100</strong><span class="small">prototype</span></div></div><div class="risk-list">${items.length?items.map(renderRiskItem).join(''):'<div class="risk-empty">Nog onvoldoende gegevens voor een duidelijke risico-inschatting.</div>'}</div><p class="risk-disclaimer">Deze risico-inschatting en productmatches zijn prototype-logica en geen definitief acceptatie- of verzekeringsadvies van Univé.</p></section>`
}
function renderRiskItem(r){
 const product=r.product?productDefs[r.product]:null;return `<article class="risk-item"><div class="risk-item-head"><div><h3>${r.title}</h3><p>${r.summary}</p></div><span class="risk-level ${r.level}">${riskLevelLabel(r.level)}</span></div><ul class="risk-evidence">${r.evidence.map(e=>`<li><span class="source-badge ${e.source}">${riskSourceLabel(e.source)}</span><span>${e.label}</span></li>`).join('')}</ul>${product?`<div class="match-box"><div class="match-copy"><strong>Productmatch: ${product.name}</strong><br><span class="muted">Deze verzekering sluit in dit prototype aan op dit specifieke risico.</span></div><div class="match-score">${r.score}% match</div></div>`:`<div class="match-box"><div class="match-copy"><strong>Nog geen directe online productmatch</strong><br><span class="muted">Dit signaal nemen we wel mee in de risico-inschatting.</span></div></div>`}</article>`
}
function defaultProduct(type){let d=productDefs[type],coverage=type==='auto'?'WA + beperkt casco':(d.coverageOptions?.[1]||d.coverageOptions?.[0]||1);return {id:type+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),type,coverage,deductible:type==='auto'?250:(d.deductibles.includes(250)?250:d.deductibles[0]),object:type==='auto'?{name:'Volkswagen Transporter',plate:'V-123-AB'}:null}}
function generateProposal(force=false){recommend();if(force||state.selectedProducts.length===0){state.selectedProducts=Object.entries(state.recommendations).filter(([k,v])=>v.status==='recommended').map(([k])=>defaultProduct(k));}}
function setCompany(id){state.company=deep(companies[id]);state.scenario=id;state.companyLoaded=true;state.knownFacts={name:state.company.name,kvk:state.company.kvk,address:state.company.address,activity:state.company.activity,sbi:state.company.sbi,employees:state.company.employees};state.inferences=infer(state.company);state.answers={};state.selectedProducts=[];recommend()}
function eligibility(){return state.demo.eligibilityOverride||state.company?.eligibility||'ONLINE_FULL'}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function renderProgress(){document.getElementById('progress').innerHTML=steps.map((s,i)=>`<div class="step ${state.step===i+1?'active':state.step>i+1?'done':''}"><span class="step-dot">${state.step>i+1?'✓':i+1}</span><span>${s}</span></div>`).join('')}
function render(){renderProgress();let html='';switch(state.step){case 1:html=renderCompany();break;case 2:html=renderQuestions();break;case 3:html=renderProposal();break;case 4:html=renderCompose();break;case 5:html=renderDetails();break;case 6:html=renderReview();break;case 7:html=renderThanks();break}document.getElementById('main').innerHTML=html;document.getElementById('side').innerHTML=renderSide();renderMobile();renderDebug();bind();window.scrollTo({top:0,behavior:'smooth'})}
function renderCompany(){if(!state.companyLoaded)return `<div class="card hero"><div class="eyebrow">Ondernemerspakket</div><h1>Welk bedrijf wil je verzekeren?</h1><p class="lead">Zoek je bedrijf. We gebruiken bekende bedrijfsgegevens om alleen relevante vragen te stellen.</p>${state.errors.kvk?`<div class="warning"><strong>We kunnen je bedrijfsgegevens nu niet ophalen.</strong><br>Probeer het opnieuw of kies een demoscenario in het prototypepaneel.</div>`:''}<div class="field"><label for="companySearch">Bedrijfsnaam of KVK-nummer</label><div class="search-row"><input class="input" id="companySearch" placeholder="Bijv. Studio Noord of 12345678"><button class="btn btn-primary" id="searchBtn">Zoeken</button></div></div><div id="searchResults">${Object.values(companies).slice(0,3).map(c=>resultRow(c)).join('')}</div></div>`;
return `<div class="card hero"><div class="eyebrow">Je bedrijf</div><h1>Dit hebben we gevonden</h1><p class="lead">We gebruiken deze bedrijfsgegevens om je aanvraag korter te maken.</p><div class="summary-grid">${Object.entries(state.knownFacts).map(([k,v])=>`<div class="kv"><b>${({name:'Bedrijf',kvk:'KVK',address:'Adres',activity:'Branche',sbi:'SBI',employees:'Medewerkers'})[k]}</b>${v}</div>`).join('')}</div><div class="info" style="margin-top:16px"><strong>Brondata</strong><br>Dit zijn mock-bedrijfsgegevens voor het prototype. Afgeleide aannames tonen we apart en vragen we waar nodig aan je te bevestigen.</div><div class="actions"><button class="btn btn-secondary" id="changeCompany">Kies een ander bedrijf</button><button class="btn btn-primary" id="confirmCompany">Dit is mijn bedrijf</button></div></div>`}
function resultRow(c){return `<button class="result" data-company="${c.id}"><span><strong>${c.name}</strong><div class="meta">${c.address} · KVK ${c.kvk}</div></span><span>›</span></button>`}
function renderQuestions(){if(eligibility()==='ADVISOR_REQUIRED')return renderAdvisor();let c=state.company, inf=state.inferences;let blocks=[];if(inf.works_at_customer_location?.confidence==='medium')blocks.push(questionYesNo('customerLocation','Werk je regelmatig op locatie bij klanten?','Dat verwachten we op basis van je bedrijfsactiviteit. Controleer of dit klopt.',true));if(c.id==='studio')blocks.push(questionYesNo('professionalAdvice','Geef je professioneel advies of ontwerp je voor klanten?','Dit is relevant voor mogelijke financiële schade door een beroepsfout.',true));if(c.id==='painter')blocks.push(questionYesNo('companyVehicle','Gebruik je een bedrijfsauto of bestelbus?','We gebruiken dit alleen om relevante mobiliteitsrisico’s te bepalen.',true));if(['painter','salon','webshop'].includes(c.id))blocks.push(questionYesNo('inventory','Heb je inventaris, gereedschap of zakelijke apparatuur?','Denk aan machines, werkmateriaal, meubels of apparatuur.',true));if(['painter','webshop','salon'].includes(c.id))blocks.push(questionYesNo('stock','Heb je voorraad of materialen met zakelijke waarde?','Dit kan invloed hebben op het voorstel.',c.facts.stock));if(['salon','webshop'].includes(c.id))blocks.push(questionLocation());return `<div class="card"><div class="eyebrow">Over je onderneming</div><h1>Een paar dingen over je bedrijf</h1><p class="lead">We vragen alleen wat nog nodig is om je risico’s en passend aanbod te bepalen.</p>${blocks.join('')}<div class="positive"><strong>We slaan bekende gegevens over.</strong><br>Bijvoorbeeld je KVK-nummer, branche en aantal medewerkers vragen we niet opnieuw.</div><div class="actions"><button class="btn btn-secondary" data-back>Vorige</button><button class="btn btn-primary" id="toProposal">Bekijk mijn voorstel</button></div></div>`}
function questionYesNo(key,label,hint,def){let val=key in state.answers?state.answers[key]:def;return `<fieldset class="card question-card"><legend class="question-legend">${label}</legend><p class="hint">${hint}</p><div class="stack"><label class="choice ${val===true?'selected':''}"><input type="radio" name="${key}" data-answer="${key}" value="true" ${val===true?'checked':''}><span><strong>Ja</strong></span></label><label class="choice ${val===false?'selected':''}"><input type="radio" name="${key}" data-answer="${key}" value="false" ${val===false?'checked':''}><span><strong>Nee</strong></span></label></div></fieldset>`}
function questionLocation(){let val=state.answers.location|| (state.company.facts.rentedPremise?'rented':'other');return `<fieldset class="card question-card"><legend class="question-legend">Waar werk je meestal?</legend><div class="stack">${[['home','Vanuit huis'],['rented','Vanuit een gehuurd bedrijfspand'],['own','Vanuit een eigen bedrijfspand'],['customer','Op locatie bij klanten'],['other','Op meerdere of andere locaties']].map(([v,l])=>`<label class="choice ${val===v?'selected':''}"><input type="radio" name="location" data-location value="${v}" ${val===v?'checked':''}><span><strong>${l}</strong></span></label>`).join('')}</div></fieldset>`}
function renderAdvisor(){return `<div class="card hero"><div class="eyebrow">Persoonlijk vervolg</div><h1>We helpen je graag persoonlijk verder</h1><p class="lead">Voor jouw bedrijf willen we een paar dingen eerst persoonlijk bespreken.</p><div class="positive"><strong>Je gegevens blijven bewaard.</strong><br>Een adviseur kan verder met de gegevens die je al hebt ingevuld.</div><div class="actions"><button class="btn btn-secondary" data-back>Vorige</button><button class="btn btn-primary" id="contactAdvisor">Laat Univé contact opnemen</button></div></div>`}
function renderProposal(){generateProposal();let rec=state.recommendations;let selectedTypes=state.selectedProducts.map(p=>p.type);let recommended=state.selectedProducts.map(renderProduct).join('');let relevant=Object.entries(rec).filter(([k,v])=>!selectedTypes.includes(k)&&v.status==='relevant').map(([k,v])=>miniAdd(k,v)).join('');return `<div class="card hero"><div class="eyebrow">Jouw voorstel</div><h1>Jouw verzekeringsvoorstel</h1><p class="lead">Op basis van je bedrijf, je bedrijfsactiviteiten en je antwoorden hebben we eerst je belangrijkste risico’s ingeschat en daar passend aanbod aan gekoppeld.</p><div class="package-total">${packageTotal()===null?'Premie tijdelijk niet beschikbaar':money(packageTotal())+' per maand'}</div><div class="muted">${state.selectedProducts.length} verzekeringen geselecteerd</div></div>${renderRiskAssessment()}<div class="card"><h2>Ons voorstel op basis van deze risico’s</h2>${recommended||'<div class="info">Er staan nog geen verzekeringen in je pakket.</div>'}</div>${relevant?`<div class="card"><h2>Andere verzekeringen die mogelijk passen</h2>${relevant}</div>`:''}<button class="btn btn-secondary" id="addInsurance">Andere verzekering toevoegen</button><div class="actions"><button class="btn btn-secondary" data-back>Vorige</button><button class="btn btn-primary" data-next>Samenstellen</button></div>`}
function renderProduct(p){let d=productDefs[p.type],rec=state.recommendations[p.type];return `<article class="product"><div class="product-head"><div><div class="status ${rec?.status==='recommended'?'good':'neutral'}">${rec?.status==='recommended'?'Aanbevolen':'Geselecteerd'}</div><h3 style="margin-top:8px">${d.name}${p.object?' · '+p.object.name:''}</h3><div class="muted">${d.desc}</div></div><div class="price">${money(productPremium(p))}<span class="small"> p/m</span></div></div><p class="why">${rec?.reason||'Door jou toegevoegd aan het pakket.'}</p><div class="product-meta"><span><b>Dekking:</b> ${typeof p.coverage==='number'?money(p.coverage):p.coverage}</span><span><b>Eigen risico:</b> ${money(p.deductible)}</span>${p.object?`<span><b>Kenteken:</b> ${p.object.plate}</span>`:''}</div><div class="product-actions"><button class="btn btn-secondary" data-config="${p.id}">Aanpassen</button><button class="linkbtn" data-why="${p.type}">Waarom dit advies?</button><button class="linkbtn" data-remove="${p.id}">Verwijderen uit pakket</button></div></article>`}
function miniAdd(k,v){return `<div class="product"><div class="product-head"><div><h3>${productDefs[k].name}</h3><div class="muted">${v.reason}</div></div><button class="btn btn-secondary" data-add="${k}">Toevoegen</button></div></div>`}
function renderCompose(){generateProposal();return `<div class="card hero"><div class="eyebrow">Samenstellen</div><h1>Stel je pakket samen</h1><p class="lead">Pas dekkingen, eigen risico’s en objecten aan. Je ziet het premie-effect direct.</p></div><div class="card">${state.selectedProducts.map(renderProduct).join('')||'<div class="info">Voeg eerst een verzekering toe.</div>'}<button class="btn btn-secondary" id="addInsurance">Andere verzekering toevoegen</button>${state.selectedProducts.some(p=>p.type==='auto')?`<button class="btn btn-secondary" id="addVehicle" style="margin-left:8px">+ Bedrijfsauto toevoegen</button>`:''}</div><div class="actions"><button class="btn btn-secondary" data-back>Vorige</button><button class="btn btn-primary" data-next>Verder met je gegevens</button></div>`}
function renderDetails(){return `<div class="card hero"><div class="eyebrow">Je gegevens</div><h1>Je gegevens voor de aanvraag</h1><p class="lead">Nu je pakket is samengesteld, vragen we alleen de gegevens die nodig zijn voor de aanvraag.</p><div class="field"><label for="custName">Naam contactpersoon</label><input class="input" id="custName" data-customer="name" value="${state.customer.name}" autocomplete="name"></div><div class="field"><label for="email">E-mailadres</label><input class="input" id="email" type="email" data-customer="email" value="${state.customer.email}" autocomplete="email"></div><div class="field"><label for="phone">Telefoonnummer</label><input class="input" id="phone" data-customer="phone" value="${state.customer.phone}" autocomplete="tel"></div><div class="field"><label for="date">Ingangsdatum</label><input class="input" id="date" type="date" data-customer="startDate" value="${state.customer.startDate}"></div><div class="field"><label for="iban">IBAN</label><input class="input" id="iban" data-customer="iban" value="${state.customer.iban}" placeholder="NL00 BANK 0000 0000 00"></div><div class="actions"><button class="btn btn-secondary" data-back>Vorige</button><button class="btn btn-primary" id="toReview">Controleren</button></div></div>`}
function renderReview(){return `<div class="card hero"><div class="eyebrow">Controleren & aanvragen</div><h1>Controleer je aanvraag</h1><p class="lead">Controleer je bedrijf, verzekeringen en gegevens voordat je aanvraagt.</p></div><div class="card"><h2>Je bedrijf</h2>${reviewRows([['Bedrijf',state.company.name],['KVK',state.company.kvk],['Adres',state.company.address],['Branche',state.company.activity]])}<button class="linkbtn" data-jump="1">Wijzigen</button></div><div class="card"><h2>Je verzekeringen</h2>${state.selectedProducts.map(p=>`<div class="lineitem"><span><strong>${productDefs[p.type].name}${p.object?' · '+p.object.name:''}</strong><br><span class="small muted">${typeof p.coverage==='number'?money(p.coverage):p.coverage} · eigen risico ${money(p.deductible)}${p.object?' · '+p.object.plate:''}</span></span><strong>${money(productPremium(p))}</strong></div>`).join('')}<button class="linkbtn" data-jump="4">Wijzigen</button></div><div class="card"><h2>Je gegevens</h2>${reviewRows([['Contactpersoon',state.customer.name||'Nog niet ingevuld'],['E-mail',state.customer.email||'Nog niet ingevuld'],['Telefoon',state.customer.phone||'Nog niet ingevuld'],['Ingangsdatum',state.customer.startDate],['IBAN',state.customer.iban||'Nog niet ingevuld']])}<button class="linkbtn" data-jump="5">Wijzigen</button></div><div class="card"><div class="package-total">Totaal ${packageTotal()===null?'—':money(packageTotal())+' p/m'}</div><p class="hint">Prototypepremies zijn fictief en alleen bedoeld om interactielogica te demonstreren.</p><div class="actions"><button class="btn btn-secondary" data-back>Vorige</button><button class="btn btn-primary" id="submitApp">Verzekeringen aanvragen</button></div></div>`}
function reviewRows(rows){return rows.map(([a,b])=>`<div class="lineitem"><span class="muted">${a}</span><span style="text-align:right">${b}</span></div>`).join('')}
function renderThanks(){return `<div class="card hero"><div class="status good">Aanvraag ontvangen</div><h1>Bedankt voor je aanvraag</h1><p class="lead">We hebben je aanvraag ontvangen.</p><h2>Wat gebeurt er nu?</h2><ol><li>We controleren je aanvraag.</li><li>Je ontvangt een bevestiging.</li><li>Na acceptatie gaan je verzekeringen in.</li></ol><button class="btn btn-secondary" id="resetApp">Nieuwe demo starten</button></div>`}
function renderSide(){if(!state.companyLoaded||state.step===1||state.step===7)return '';let total=packageTotal();return `<div class="card"><h3>Jouw pakket</h3>${state.selectedProducts.length?state.selectedProducts.map(p=>`<div class="lineitem"><span>${productDefs[p.type].name}${p.object?'<br><span class="small muted">'+p.object.name+'</span>':''}</span><strong>${money(productPremium(p))}</strong></div>`).join(''):'<p class="muted small">Nog geen verzekeringen geselecteerd.</p>'}<div class="divider"></div><div class="lineitem"><strong>Totaal</strong><strong>${total===null?'—':money(total)+' p/m'}</strong></div>${state.step>=3&&state.step<=5?`<button class="btn btn-primary" data-next>Verder</button>`:''}</div>`}
function renderMobile(){let bar=document.getElementById('mobileBar');let total=packageTotal();bar.classList.toggle('show',state.companyLoaded&&state.step>=3&&state.step<=5);document.getElementById('mobileCount').textContent=`${state.selectedProducts.length} verzekeringen`;document.getElementById('mobileTotal').textContent=total===null?'Premie niet beschikbaar':money(total)+' p/m';}
function modal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modalBackdrop').classList.add('open')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')}
function showWhy(type){let rec=state.recommendations[type],known=[state.company.activity,`KVK ${state.company.kvk}`],confirmed=[];if(getFact('customerLocation'))confirmed.push('je werkt bij klanten');if(getFact('professionalAdvice'))confirmed.push('je geeft professioneel advies');if(state.company.employees>0)confirmed.push(`je hebt ${state.company.employees} medewerkers`);modal(`<h2 id="modalTitle">Waarom adviseren we dit?</h2><p><strong>Dit weten we uit bedrijfsdata:</strong></p><ul>${known.map(x=>`<li>${x}</li>`).join('')}</ul><p><strong>Dit heb je bevestigd of aangegeven:</strong></p><ul>${confirmed.map(x=>`<li>${x}</li>`).join('')||'<li>Geen extra bevestiging nodig</li>'}</ul><div class="positive"><strong>Daarom vinden we dit passend:</strong><br>${rec?.reason||'Je hebt deze verzekering zelf toegevoegd.'}</div>`)}
function configure(id){let p=state.selectedProducts.find(x=>x.id===id),d=productDefs[p.type];let covs=p.type==='auto'?d.coverages:d.coverageOptions;modal(`<h2 id="modalTitle">${d.name} aanpassen</h2>${p.object?`<div class="info"><strong>${p.object.name}</strong><br>${p.object.plate}</div>`:''}<div class="field"><label>Dekking</label><div class="stack">${covs.map(c=>`<label class="choice ${String(p.coverage)===String(c)?'selected':''}"><input type="radio" name="cfgcov" data-cfgcov="${id}" value="${c}" ${String(p.coverage)===String(c)?'checked':''}><span><strong>${typeof c==='number'?money(c):c}</strong></span></label>`).join('')}</div></div><div class="field"><label>Eigen risico</label><div class="stack">${d.deductibles.map(x=>`<label class="choice ${p.deductible===x?'selected':''}"><input type="radio" name="cfgded" data-cfgded="${id}" value="${x}" ${p.deductible===x?'checked':''}><span><strong>${money(x)}</strong></span></label>`).join('')}</div></div><div class="positive"><strong>Nieuwe productpremie</strong><br><span id="cfgPrice">${money(productPremium(p))} per maand</span></div><div class="actions-right" style="margin-top:18px"><button class="btn btn-primary" id="cfgDone">Klaar</button></div>`);bindModal()}
function addInsuranceModal(){let available=Object.keys(productDefs).filter(k=>!state.selectedProducts.some(p=>p.type===k));modal(`<h2 id="modalTitle">Andere verzekering toevoegen</h2><h3>Past mogelijk bij jouw situatie</h3><div class="stack">${available.filter(k=>state.recommendations[k]?.status==='relevant').map(k=>addRow(k)).join('')||'<p class="muted">Geen extra relevante producten gevonden.</p>'}</div><h3 style="margin-top:22px">Andere zakelijke verzekeringen</h3><div class="stack">${available.filter(k=>state.recommendations[k]?.status!=='relevant').map(k=>addRow(k)).join('')}</div>`);bindModal()}
function addRow(k){return `<div class="choice"><div style="flex:1"><strong>${productDefs[k].name}</strong><div class="sub">${productDefs[k].desc}</div></div><button class="btn btn-secondary" data-modaladd="${k}">Toevoegen</button></div>`}
function removeProduct(id){let p=state.selectedProducts.find(x=>x.id===id);modal(`<h2 id="modalTitle">Weet je het zeker?</h2><p>Je verwijdert <strong>${productDefs[p.type].name}</strong> uit je pakket.</p><div class="warning">${p.type==='avb'?'Schade die je tijdens je werkzaamheden bij anderen veroorzaakt, is dan niet verzekerd via dit pakket.':'Dit risico is dan niet verzekerd via dit pakket.'}</div><div class="actions-right" style="margin-top:18px"><button class="btn btn-secondary" id="keepProduct">Behouden</button><button class="btn btn-danger" id="confirmRemove" data-id="${id}">Verwijderen</button></div>`);document.getElementById('keepProduct').onclick=closeModal;document.getElementById('confirmRemove').onclick=e=>{state.selectedProducts=state.selectedProducts.filter(x=>x.id!==e.currentTarget.dataset.id);closeModal();toast('Product verwijderd. Totaalpremie is bijgewerkt.');render()}}
function addVehicle(){modal(`<h2 id="modalTitle">Bedrijfsauto toevoegen</h2><div class="field"><label for="plate">Kenteken</label><input class="input" id="plate" value="V-456-CD"></div><div class="field"><label for="vehicle">Voertuig</label><input class="input" id="vehicle" value="Volkswagen Caddy"></div><div class="field"><label>Dekking</label><select class="select" id="vehicleCov"><option>WA</option><option selected>WA + beperkt casco</option><option>Allrisk</option></select></div><div class="field"><label>Eigen risico</label><select class="select" id="vehicleDed"><option>0</option><option selected>250</option><option>500</option></select></div><button class="btn btn-primary" id="confirmVehicle">Toevoegen</button>`);document.getElementById('confirmVehicle').onclick=()=>{let p=defaultProduct('auto');p.object={name:document.getElementById('vehicle').value,plate:document.getElementById('plate').value};p.coverage=document.getElementById('vehicleCov').value;p.deductible=Number(document.getElementById('vehicleDed').value);state.selectedProducts.push(p);closeModal();toast('Tweede bedrijfsauto toegevoegd.');render()}}
function bindModal(){document.querySelectorAll('[data-cfgcov]').forEach(x=>x.onchange=e=>{let p=state.selectedProducts.find(p=>p.id===e.target.dataset.cfgcov);p.coverage=isNaN(Number(e.target.value))?e.target.value:Number(e.target.value);document.getElementById('cfgPrice').textContent=money(productPremium(p))+' per maand';e.target.closest('.stack').querySelectorAll('.choice').forEach(c=>c.classList.toggle('selected',c.contains(e.target)))});document.querySelectorAll('[data-cfgded]').forEach(x=>x.onchange=e=>{let p=state.selectedProducts.find(p=>p.id===e.target.dataset.cfgded);p.deductible=Number(e.target.value);document.getElementById('cfgPrice').textContent=money(productPremium(p))+' per maand';e.target.closest('.stack').querySelectorAll('.choice').forEach(c=>c.classList.toggle('selected',c.contains(e.target)))});document.querySelectorAll('[data-modaladd]').forEach(b=>b.onclick=e=>{state.selectedProducts.push(defaultProduct(e.currentTarget.dataset.modaladd));closeModal();toast('Verzekering toegevoegd.');render()});let d=document.getElementById('cfgDone');if(d)d.onclick=()=>{closeModal();toast('Premie bijgewerkt.');render()}}
function next(){if(state.step<6){state.step++;render()}}
function back(){if(state.step>1){state.step--;render()}}
function bind(){const main=document.getElementById('main');if(main)main.onclick=e=>{const companyButton=e.target.closest('[data-company]');if(companyButton&&main.contains(companyButton)){e.preventDefault();const id=companyButton.dataset.company;if(companies[id]){setCompany(id);render()}return}};let s=document.getElementById('searchBtn');if(s)s.onclick=()=>{let q=document.getElementById('companySearch').value.toLowerCase();let matches=Object.values(companies).filter(c=>(c.name+' '+c.kvk).toLowerCase().includes(q));document.getElementById('searchResults').innerHTML=(matches.length?matches.map(resultRow).join(''):'<div class="warning">We kunnen dit bedrijf niet vinden. Controleer je gegevens of zoek op bedrijfsnaam.</div>')};let cc=document.getElementById('confirmCompany');if(cc)cc.onclick=()=>{if(eligibility()==='ADVISOR_REQUIRED'){state.step=2}else state.step=2;render()};let ch=document.getElementById('changeCompany');if(ch)ch.onclick=()=>{state.company=null;state.companyLoaded=false;render()};document.querySelectorAll('[data-answer]').forEach(i=>i.onchange=e=>{state.answers[e.target.dataset.answer]=e.target.value==='true';recommend();render()});document.querySelectorAll('[data-location]').forEach(i=>i.onchange=e=>{state.answers.location=e.target.value;state.answers.rentedPremise=e.target.value==='rented';state.answers.ownPremise=e.target.value==='own';state.answers.customerLocation=e.target.value==='customer';recommend();render()});let tp=document.getElementById('toProposal');if(tp)tp.onclick=()=>{generateProposal(true);state.step=3;render()};document.querySelectorAll('[data-next]').forEach(b=>b.onclick=next);document.querySelectorAll('[data-back]').forEach(b=>b.onclick=back);document.querySelectorAll('[data-config]').forEach(b=>b.onclick=()=>configure(b.dataset.config));document.querySelectorAll('[data-why]').forEach(b=>b.onclick=()=>showWhy(b.dataset.why));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeProduct(b.dataset.remove));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{state.selectedProducts.push(defaultProduct(b.dataset.add));render()});let ai=document.getElementById('addInsurance');if(ai)ai.onclick=addInsuranceModal;let av=document.getElementById('addVehicle');if(av)av.onclick=addVehicle;document.querySelectorAll('[data-customer]').forEach(i=>i.oninput=e=>state.customer[e.target.dataset.customer]=e.target.value);let tr=document.getElementById('toReview');if(tr)tr.onclick=()=>{state.step=6;render()};document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{state.step=Number(b.dataset.jump);render()});let sub=document.getElementById('submitApp');if(sub)sub.onclick=()=>{state.applicationStatus='submitted';state.step=7;render()};let ra=document.getElementById('resetApp');if(ra)ra.onclick=()=>{state=initialState('studio');render()};let ca=document.getElementById('contactAdvisor');if(ca)ca.onclick=()=>{state.applicationStatus='advisor_requested';modal(`<h2 id="modalTitle">Contactverzoek ontvangen</h2><div class="positive"><strong>Je gegevens zijn bewaard.</strong><br>In dit prototype simuleren we dat een Univé-adviseur contact opneemt.</div><button class="btn btn-primary" id="advisorDone" style="margin-top:18px">Klaar</button>`);document.getElementById('advisorDone').onclick=closeModal}}
function renderDebug(){let d=document.getElementById('debugPanel');let c=state.company||companies[state.scenario];d.innerHTML=`<h2>Prototype-paneel</h2><p class="small">Niet zichtbaar in de normale klantflow.</p><div class="panel"><label>Scenario</label><select class="select" id="dbgScenario">${Object.values(companies).map(x=>`<option value="${x.id}" ${x.id===state.scenario?'selected':''}>${x.name}</option>`).join('')}</select><button id="dbgLoad">Scenario laden</button></div><div class="panel"><label>Spring naar stap</label><select class="select" id="dbgStep">${steps.map((s,i)=>`<option value="${i+1}" ${state.step===i+1?'selected':''}>${i+1}. ${s}</option>`).join('')}</select><button id="dbgGo">Ga naar stap</button></div><div class="panel"><label>Eligibility override</label><select class="select" id="dbgEligibility"><option value="">Volgens scenario</option>${['ONLINE_FULL','ONLINE_WITH_EXTRA_QUESTIONS','ONLINE_PARTIAL','ADVISOR_REQUIRED','EXCLUDED'].map(x=>`<option ${state.demo.eligibilityOverride===x?'selected':''}>${x}</option>`).join('')}</select><button id="dbgEligSet">Toepassen</button></div><div class="panel"><button id="dbgKvk">KVK-storing: ${state.errors.kvk?'AAN':'UIT'}</button><button id="dbgPrice">Prijsstoring: ${state.errors.pricing?'AAN':'UIT'}</button><button id="dbgReset">State resetten</button></div><div class="panel"><strong>Risk engine</strong><pre>SBI: ${c.sbi}\nActiviteit: ${c.activity}\nEligibility: ${eligibility()}\n\nKnown:\n${Object.keys(state.knownFacts).map(k=>'- '+k).join('\n')||'- nog niet geladen'}\n\nInferred:\n${Object.entries(state.inferences).map(([k,v])=>`- ${k} [${v.confidence}]`).join('\n')||'- geen'}\n\nConfirmed risks:\n${Object.keys(state.riskSignals).map(k=>'- '+k).join('\n')||'- geen'}\n\nRecommendations:\n${Object.entries(state.recommendations).map(([k,v])=>`- ${k}: ${v.status}`).join('\n')||'- geen'}</pre></div>`;bindDebug()}
function bindDebug(){let d=document.getElementById('debugPanel');let load=d.querySelector('#dbgLoad');if(load)load.onclick=()=>{let id=d.querySelector('#dbgScenario').value;state=initialState(id);setCompany(id);render()};let go=d.querySelector('#dbgGo');if(go)go.onclick=()=>{if(!state.companyLoaded)setCompany(state.scenario);state.step=Number(d.querySelector('#dbgStep').value);if(state.step>=3)generateProposal();render()};let es=d.querySelector('#dbgEligSet');if(es)es.onclick=()=>{state.demo.eligibilityOverride=d.querySelector('#dbgEligibility').value;render()};let kv=d.querySelector('#dbgKvk');if(kv)kv.onclick=()=>{state.errors.kvk=!state.errors.kvk;if(state.errors.kvk){state.company=null;state.companyLoaded=false;state.step=1}render()};let pr=d.querySelector('#dbgPrice');if(pr)pr.onclick=()=>{state.errors.pricing=!state.errors.pricing;render()};let rs=d.querySelector('#dbgReset');if(rs)rs.onclick=()=>{state=initialState('studio');render()}}
document.getElementById('demoToggle').onclick=()=>document.getElementById('debugPanel').classList.toggle('open');document.getElementById('modalClose').onclick=closeModal;document.getElementById('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};document.getElementById('mobileNext').onclick=next;
render();
</script>
</body>
</html>
